# =====================================================================
#              НАСТРОЙКИ СТАНКА И ОПТИМИЗАЦИИ РАСТРА
# =====================================================================

# Физические параметры лазерного модуля
laser:
  speed: 1000          # Рабочая скорость перемещения (мм/мин)
  power: 100           # Мощность выжигания (S-значение для GRBL)
  beam_diameter: 0.1   # Физический диаметр фокусного пятна лазера (мм)
  overlap_percent: 20  # Перекрытие строк в % (50% убирает полосатость)

# Настройки фото-выжигания платы
board:
  negative: false        # true = негатив (жечь пустоту), false = позитив (жечь дорожки)
  mirror_x: false        # true = отзеркалить по горизонтали (для нижних слоев платы)

# Смещение начала координат относительно нуля станка (в миллиметрах)
offset:
  x: 0.0
  y: 0.0

